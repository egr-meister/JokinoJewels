name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"
  BUILD_TOOLS_VERSION: "36.0.0"
  APK_PATH: app/build/outputs/apk/release/app-release.apk
  AAB_PATH: app/build/outputs/bundle/release/app-release.aab

jobs:
  build:
    name: Signed release (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner ships a preinstalled Android SDK with current cmdline-tools.
      # (android-actions/setup-android is not used: its default package list asks for the
      # removed legacy "tools" package and sdkmanager fails.)
      - name: Install SDK Platform 36 and Build Tools 36.0.0
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found under $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-36" "build-tools;${BUILD_TOOLS_VERSION}" "platform-tools"
          ls "$SDK/platforms" "$SDK/build-tools"

      # Gradle is provisioned at a fixed version, so a committed gradle-wrapper.jar is not required.
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          exit $missing

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release-keystore.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore is empty — check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify APK signature (apksigner)
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          if [ ! -f "$APK_PATH" ]; then echo "::error::APK not found at $APK_PATH"; exit 1; fi
          if ! "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > apksigner.txt 2>&1; then
            cat apksigner.txt
            echo "::error::apksigner verification FAILED."
            exit 1
          fi
          grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" apksigner.txt || true
          if grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::APK is signed with the Android DEBUG certificate. Refusing to publish."
            exit 1
          fi

      - name: Verify AAB signature
        run: |
          if [ ! -f "$AAB_PATH" ]; then echo "::error::AAB not found at $AAB_PATH"; exit 1; fi
          if ! jarsigner -verify "$AAB_PATH" > jarsigner.txt 2>&1 || ! grep -q "jar verified" jarsigner.txt; then
            cat jarsigner.txt
            echo "::error::AAB signature verification FAILED."
            exit 1
          fi
          keytool -printcert -jarfile "$AAB_PATH" > aab-cert.txt 2>&1
          grep -E "Owner:|SHA256:" aab-cert.txt || true
          if grep -q "CN=Android Debug" aab-cert.txt; then
            echo "::error::AAB is signed with the Android DEBUG certificate. Refusing to publish."
            exit 1
          fi

      - name: Check 16 KB page-size alignment
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          if "$ZIPALIGN" -c -P 16 -v 4 "$APK_PATH" > zipalign.txt 2>&1; then
            tail -n 1 zipalign.txt
          else
            tail -n 20 zipalign.txt
            echo "::error::APK is not 16 KB aligned."
            exit 1
          fi
          if unzip -l "$APK_PATH" | grep -q "\.so$"; then
            echo "::warning::Native libraries found — verify them with the Play Console 16 KB check."
          else
            echo "No native libraries: 16 KB memory page size compatible."
          fi

      - name: Upload release APK (test artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jokino-jewels-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload release AAB (Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jokino-jewels-release-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"
